name: SOKORA Web Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build React web app
        run: npm run build
      - name: Verify web output
        run: test -s dist/index.html
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a1f52dd914e46224f2a3cb7ad46e7338
        run: npx wrangler deploy
      - name: Explain skipped deployment when token is missing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Cloudflare deploy skipped. Add CLOUDFLARE_API_TOKEN in GitHub repository Actions secrets."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sokora-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
