name: SOKORA build check

on:
  push:
    branches: [main, feature/cloudflare-d1-foundation]
  pull_request:
    branches: [main, feature/commerce-foundation]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run Worker route tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
